ay:grid;gap:11px;margin-top:14px}.payments{display:grid;gap:9px}.payment-line{display:grid;grid-template-columns:1fr 110px 36px;gap:7px;align-items:start}.payment-extra{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:7px}.payment-extra input{min-height:38px}.payment-line select,.payment-line input{min-height:40px;padding:8px}.small-button{min-height:38px;padding:6px 9px}.notice{padding:11px 13px;border-radius:12px;background:var(--brand2);color:var(--ink);font-size:13px}.error{color:var(--danger);font-size:13px;white-space:pre-wrap}.success{color:var(--good);font-weight:700}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.modal-backdrop{position:fixed;inset:0;background:rgba(6,13,24,.55);display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal .actions{display:flex;gap:8px;margin-top:16px}.modal .actions>*{flex:1}.modal:has(.history-panel){width:min(820px,100%);max-height:90vh;overflow:auto}.history-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}.history-list{display:grid;gap:8px}.history-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel2)}.history-row button{min-height:38px;padding:7px 11px}.history-meta{font-size:12px;color:var(--muted)}@media(max-width:620px){.history-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions{gap:5px}.top-actions button{padding:7px 8px}}.hidden{display:none!important}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin:15px}.receipt{display:grid;gap:8px}.receipt h2{text-align:center}.receipt .big{font-size:24px;font-weight:900;text-align:center}.receipt hr{border:0;border-top:1px dashed var(--line);width: <body>
<header class="topbar">
 <div class="brand">MMG <span>OQVELA</span></div>
 <div class="store-title" id="storeName">نقطة البيع</div>
 <div class="top-spacer"></div>
 <div class="top-actions">
  <button class="secondary" id="historyBtn" type="button">سجل المبيعات</button>
  <button class="secondary" id="languageBtn" type="button">English</button>
  <button class="secondary" id="themeBtn" type="button" aria-label="Theme">◐</button>
  <button class="quiet" id="backBtn" type="button">رجوع</button>
 </div>
</header>
<main class="page">
 <section class="sessionbar" id="sessionBar">
  <div><strong id="sessionTitle">جلسة الصندوق</strong><div class="muted" id="sessionHint">يجب فتح جلسة قبل اعتماد أي عملية بيع</div></div>
  <div class="top-spacer"></div>
  <div class="field"><label id="currencyLabel" for="currencySelect">عملة البيع</label><select id="currencySelect"><option value="USD">USD</option><option value="SYP">SYP</option></select></div>
  <div id="sessionControls"></div>
 </section>
 <div class="layout">
  <section class="catalog">
   <div class="section-head"><h1 id="catalogTitle">المنتجات</h1><span class="muted" id="productCount"></span></div>
   <div class="search-row">
    <input id="searchInput" type="search" autocomplete="off" placeholder="ابحث بالاسم أو SKU أو امسح الباركود">
    <select id="categoryFilter"><option value="">كل المنتجات</option></select>
   </div>
   <div id="products" class="products"><div class="empty">جارٍ تحميل المنتجات...</div></div>
   <div id="catalogError" class="error"></div>
  </section>
  <aside class="cart-panel">
   <div class="cart-head"><h2 id="cartTitle">سلة البيع</h2><button class="quiet small-button" id="clearCartBtn" type="button">إفراغ</button></div>
   <div id="cartList" class="cart-list"><div class="empty" id="emptyCart">السلة فارغة</div></div>
   <div class="totals">
    <div class="total-row"><span id="subtotalLabel">المجموع</span><strong id="subtotalValue">—</strong></div>
    <div class="field"><label id="discountLabel" for="discountInput">الخصم (اختياري)</label><input id="discountInput" type="number" min="0" step="0.01" value="0"></div>
    <div class="field hidden" id="discountReasonWrap"><label id="discountReasonLabel" for="discountReason">سبب الخصم</label><input id="discountReason" maxlength="300"></div>
    <div class="total-row grand"><span id="totalLabel">الإجمالي</span><span id="totalValue">—</span></div>
   </div>
   <div class="checkout">
    <div class="section-head"><h3 id="paymentTitle">الدفع</h3><button class="secondary small-button" id="addPaymentBtn" type="button">+ تقسيم الدفع</button></div>
    <div id="payments" class="payments"></div>
    <div id="shamcashHelp" class="notice hidden">للدفع عبر شام كاش، أدخل رقم العملية واسم المرسل.</div>
    <div id="quoteError" class="error"></div>
    <div id="saleMessage" aria-live="polite"></div>
    <button id="completeSaleBtn" type="button" disabled>اعتماد البيع</button>
   </div>
  </aside>
 </div>
 <div class="footer-note" id="footerNote">الأسعار والمخزون يعاد التحقق منهما على الخادم عند اعتماد البيع.</div>
</main>
<div id="modalRoot"></div>
<script>
(() => {
 "use strict";
 const $=id=>document.getElementById(id);
 const translations={
  ar:{pos:"نقطة البيع",back:"رجوع",session:"جلسة الصندوق",needSession:"يجب فتح جلسة قبل اعتماد أي عملية بيع",currency:"عملة البيع",openSession:"فتح جلسة",closeSession:"إغلاق الجلسة",openingCash:"رصيد بداية الصندوق",open:"فتح",products:"المنتجات",allProducts:"كل المنتجات",search:"ابحث بالاسم أو SKU أو امسح الباركود",cart:"سلة البيع",clear:"إفراغ",empty:"السلة فارغة",subtotal:"المجموع",discount:"الخصم (اختياري)",discountReason:"سبب الخصم",total:"الإجمالي",payment:"الدفع",split:"+ تقسيم الدفع",cash:"نقدي",card:"بطاقة",digital:"دفع رقمي",shamcash:"شام كاش",complete:"اعتماد البيع",add:"إضافة",stock:"المتاح",loading:"جارٍ التحميل...",noProducts:"لا توجد منتجات مطابقة",close:"إغلاق",countedCash:"النقد الفعلي في الصندوق",expectedCash:"النقد المتوقع",difference:"الفرق",confirmClose:"تأكيد الإغلاق",cancel:"إلغاء",transaction:"رقم العملية",sender:"اسم المرسل",saleDone:"تم اعتماد البيع بنجاح",print:"طباعة الإيصال",newSale:"بيع جديد",variant:"اختر المتغير",noSession:"لا توجد جلسة مفتوحة لهذه العملة",openFirst:"افتح جلسة الصندوق أولاً",quoteFailed:"تعذر تحديث السعر",requiredPayment:"يجب أن يساوي مجموع الدفعات إجمالي الفاتورة",remove:"حذف",quantity:"الكمية",unitPrice:"سعر الوحدة",lineTotal:"الإجمالي",currencyMismatch:"تغيير العملة سيؤدي إلى إفراغ السلة الحالية. هل تريد المتابعة؟",searchEmpty:"أدخل اسم المنتج أو SKU أو امسح الباركود",sessionOpened:"تم فتح جلسة الصندوق",sessionClosed:"تم إغلاق جلسة الصندوق",failed:"حدث خطأ",shamHelp:"للدفع عبر شام كاش، أدخل رقم العملية واسم المرسل.",footer:"الأسعار والمخزون يعاد التحقق منهما على الخادم عند اعتماد البيع.",closeNotes:"ملاحظات الإغلاق",openNotes:"ملاحظات الافتتاح",discountPermission:"لا تملك صلاحية الخصم أو لم تذكر سبباً صالحاً.",history:"سجل المبيعات",receipt:"تفاصيل الفاتورة",filter:"تصفية",allStatuses:"كل الحالات",posted:"مكتملة",voided:"ملغاة",partially_refunded:"مستردة جزئياً",refunded:"مستردة",from:"من تاريخ",to:"إلى تاريخ",status:"الحالة",items:"الأصناف",view:"عرض",noSales:"لا توجد مبيعات مطابقة",payments:"الدفعات",backToHistory:"العودة للسجل",print:"طباعة الإيصال",returnSale:"إرجاع أصناف",returnReason:"سبب الإرجاع",refundAmount:"مبلغ الاسترداد",refundMethod:"طريقة رد المبلغ",returnItem:"الصنف المرتجع",returnQty:"الكمية المرتجعة",restock:"إعادة الصنف للمخزون",submitReturn:"تأكيد الإرجاع",returnDone:"تم تسجيل المرتجع والاسترداد",returnHistory:"سجل المرتجعات",noReturns:"لا توجد مرتجعات مسجلة",returned:"الكمية المرتجعة",remaining:"المتبقي للإرجاع",returnPayments:"تفاصيل رد المبلغ",returnNumber:"رقم المرتجع",refundRequired:"أدخل مبلغ الاسترداد وطريقة رده",selectReturnItems:"حدد كمية صنف واحد على الأقل",voidSale:"إلغاء الفاتورة بالكامل",voidReason:"سبب الإلغاء",confirmVoid:"تأكيد الإلغاء ورد كامل المبلغ",voidDone:"تم إلغاء الفاتورة وتسجيل رد المبلغ",voidWarning:"سيتم إرجاع كامل الأصناف للمخزون وإثبات رد المبلغ حسب وسائل الدفع الأصلية. لا يمكن التراجع عن العملية."},
  en:{pos:"Point of Sale",back:"Back",session:"Cash session",needSession:"Open a cash session before completing a sale",currency:"Sale currency",openSession:"Open session",closeSession:"Close session",openingCash:"Opening cash",open:"Open",products:"Products",allProducts:"All products",search:"Search name / SKU or scan barcode",cart:"Sale cart",clear:"Clear",empty:"Cart is empty",subtotal:"Subtotal",discount:"Discount (optional)",discountReason:"Discount reason",total:"Total",payment:"Payment",split:"+ Split tender",cash:"Cash",card:"Card",digital:"Digital",shamcash:"Sham Cash",complete:"Complete sale",add:"Add",stock:"Available",loading:"Loading...",noProducts:"No matching products",close:"Close",countedCash:"Counted cash",expectedCash:"Expected cash",difference:"Difference",confirmClose:"Confirm close",cancel:"Cancel",transaction:"Transaction number",sender:"Sender name",saleDone:"Sale posted successfully",print:"Print receipt",newSale:"New sale",variant:"Choose variant",noSession:"No open session for this currency",openFirst:"Open a cash session first",quoteFailed:"Unable to refresh prices",requiredPayment:"Payment lines must equal the invoice total",remove:"Remove",quantity:"Qty",unitPrice:"Unit price",lineTotal:"Line total",currencyMismatch:"Changing currency will clear the current cart. Continue?",searchEmpty:"Enter a product name, SKU or scan a barcode",sessionOpened:"Cash session opened",sessionClosed:"Cash session closed",failed:"Something went wrong",shamHelp:"For Sham Cash, enter the transaction number and sender name.",footer:"Prices and stock are revalidated by the server when posting a sale.",closeNotes:"Closing notes",openNotes:"Opening notes",discountPermission:"Discount permission is missing or a valid reason was not provided.",history:"Sales history",receipt:"Receipt details",filter:"Filter",allStatuses:"All statuses",posted:"Posted",voided:"Voided",partially_refunded:"Partially refunded",refunded:"Refunded",from:"From date",to:"To date",status:"Status",items:"Items",view:"View",noSales:"No matching sales",payments:"Payments",backToHistory:"Back to history",print:"Print receipt",returnSale:"Return items",returnReason:"Return reason",refundAmount:"Refund amount",refundMethod:"Refund method",returnItem:"Returned item",returnQty:"Return quantity",restock:"Restock returned item",submitReturn:"Confirm return",returnDone:"Return and refund recorded",returnHistory:"Return history",noReturns:"No returns recorded",returned:"Returned",remaining:"Remaining",returnPayments:"Refund breakdown",returnNumber:"Return number",refundRequired:"Enter the refund amount and refund method",selectReturnItems:"Select a quantity for at least one item",voidSale:"Void entire sale",voidReason:"Void reason",confirmVoid:"Confirm void and full refund",voidDone:"Sale voided and full refund recorded",voidWarning:"All items will be restored to stock and the refund recorded against the original payment methods. This action cannot be undone."}
 };
 let lang="ar",storeId="",store=null,products=[],variants={},cart=[],session=null,pricingMode="manual",tiers=[],quoteBusy=false,pendingKey=null,paymentLines=[{payment_method:"cash",amount:0,transaction_reference:"",sender_name:""}];
 const t=key=>translations[lang][key]||translations.en[key]||key;
 function setText(id,key){$(id).textContent=t(key);}
 function money(value,currency=$("currencySelect").value){
  const n=Number(value||0);
  try{return new Intl.NumberFormat(lang==="ar"?"ar":"en",{style:"currency",currency,maximumFractionDigits:2}).format(n);}
  catch{return n.toFixed(2)+" "+currency;}
 }
 function api(path,options={}){
  return fetch(path,{credentials:"same-origin",...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}})
   .then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||t("failed"));return data;});
 }
 function storePath(suffix){return "/api/stores/"+encodeURIComponent(storeId)+suffix;}
 function showError(id,error){$(id).textContent=error?.message||String(error||"");}
 function updateDirection(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("languageBtn").textContent=lang==="ar"?"English":"العربية";document.title="MMG OQVELA · "+t("pos");}
 function applyLabels(){
  setText("sessionTitle","session");setText("sessionHint","needSession");setText("currencyLabel","currency");setText("catalogTitle","products");setText("cartTitle","cart");setText("clearCartBtn","clear");setText("emptyCart","empty");setText("subtotalLabel","subtotal");setText("discountLabel","discount");setText("discountReasonLabel","discountReason");setText("totalLabel","total");setText("paymentTitle","payment");setText("addPaymentBtn","split");setText("completeSaleBtn","complete");setText("footerNote","footer");$("searchInput").placeholder=t("search");$("categoryFilter").options[0].textContent=t("allProducts");updateDirection();renderPayments();renderCart();
 }
 function theme(){document.documentElement.classList.toggle("dark",localStorage.getItem("mmg-pos-theme")==="dark");}
 $("themeBtn").addEventListener("click",()=>{localStorage.setItem("mmg-pos-theme",document.documentElement.classList.contains("dark")?"light":"dark");theme();});
 $("languageBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";applyLabels();renderProducts();renderSession();});
 $("backBtn").addEventListener("click",()=>{location.href="/";});
 function modal(content){$("modalRoot").innerHTML='<div class="modal-backdrop"><section class="modal">'+content+'</section></div>';}
 function closeModal(){$("modalRoot").replaceChildren();}
 function availableProducts(){return products.filter(p=>(p.currency||"USD")===$("currencySelect").value);}
 function statusLabel(status){return t(status||"posted");}
 async function openSalesHistory(){
  modal('<div class="history-panel"><div class="section-head"><h2>'+t("history")+'</h2><button class="quiet small-button" id="historyClose">'+t("close")+'</button></div><div class="history-filters"><div class="field"><label>'+t("currency")+'</label><select id="historyCurrency"><option value="">—</option><option value="USD">USD</option><option value="SYP">SYP</option></select></div><div class="field"><label>'+t("status")+'</label><select id="historyStatus"><option value="">'+t("allStatuses")+'</option><option value="posted">'+t("posted")+'</option><option value="voided">'+t("voided")+'</option><option value="partially_refunded">'+t("partially_refunded")+'</option><option value="refunded">'+t("refunded")+'</option></select></div><div class="field"><label>'+t("from")+'</label><input id="historyFrom" type="date"></div><div class="field"><label>'+t("to")+'</label><input id="historyTo" type="date"></div></div><div class="actions"><button id="historyApply">'+t("filter")+'</button></div><div id="historyError" class="error"></div><div id="historyRows" class="history-list"><div class="empty">'+t("loading")+'</div></div></div>');
  $("historyClose").addEventListener("click",closeModal);$("historyApply").addEventListener("click",loadSalesHistory);await loadSalesHistory();
 }
 async function loadSalesHistory(){
  const rows=$("historyRows");if(!rows)return;rows.innerHTML='<div class="empty">'+t("loading")+'</div>';showError("historyError","");
  const params=new URLSearchParams({limit:"100"});
  for(const [id,key] of [["historyCurrency","currency"],["historyStatus","status"],["historyFrom","from"],["historyTo","to"]]){const value=$(id)?.value;if(value)params.set(key,value);}
  try{
   const data=await api(storePath("/pos/sales?"+params.toString()));rows.replaceChildren();
   if(!data.sales?.length){rows.innerHTML='<div class="empty">'+t("noSales")+'</div>';return;}
   for(const sale of data.sales){
    const row=document.createElement("div");row.className="history-row";const info=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("div");
    title.textContent=sale.sale_number||sale.id;meta.className="history-meta";meta.textContent=[sale.created_at,sale.customer_name||"",statusLabel(sale.status),String(sale.unit_count||0)+" "+t("items")].filter(Boolean).join(" · ");info.append(title,meta);
    const right=document.createElement("div");right.style.display="grid";right.style.gap="5px";const amount=document.createElement("strong");amount.textContent=money(sale.total,sale.currency);

   }catch(error){showError("closeError",error);button.disabled=false;}
  });
 }
 $("completeSaleBtn").addEventListener("click",async()=>{
  if(!session||!cart.length||quoteBusy)return;
  const subtotal=cart.reduce((sum,line)=>sum+Number(line.line_total||0),0);
  const discount=Math.max(0,Number($("discountInput").value)||0);
  const total=Math.max(0,Math.round((subtotal-discount)*100)/100);
  if(!paymentsMatch(total)||total<=0){showError("saleMessage",new Error(t("requiredPayment")));return;}
  const reason=$("discountReason").value.trim();
  if(discount>0&&!reason){showError("saleMessage",new Error(t("discountPermission")));return;}
  if(discount>=subtotal&&discount>0){showError("saleMessage",new Error(t("requiredPayment")));return;}
  const button=$("completeSaleBtn");button.disabled=true;showError("saleMessage","");
  pendingKey=pendingKey||crypto.randomUUID();
  try{
   const result=await api(storePath("/pos/sales"),{method:"POST",body:JSON.stringify({
    idempotency_key:pendingKey,cash_session_id:session.id,items:cart.map(line=>({product_id:line.product_id,variant_id:line.variant_id,quantity:line.quantity,tier_code:line.tier_code})),
    payments:paymentLines.map(p=>({payment_method:p.payment_method,amount:Number(p.amount),transaction_reference:p.transaction_reference||undefined,sender_name:p.sender_name||undefined})),
    discount_amount:discount,discount_reason:reason||undefined
   })});
   showReceipt(result.sale,result.items||[],paymentLines);cart=[];paymentLines=[{payment_method:"cash",amount:0}];pendingKey=null;$("discountInput").value="0";$("discountReason").value="";await loadProductsOnly();renderCart();renderPayments();
  }catch(error){showError("saleMessage",error);}
  finally{button.disabled=!session||!cart.length;}
 });
 async function loadProductsOnly(){
  try{products=(await api(storePath("/products?status=active&limit=100"))).products||[];renderProducts();}
  catch(error){showError("catalogError",error);}
 }
 function showReceipt(sale,items,payments){
  modal('<div class="receipt"><div class="brand">MMG <span>OQVELA</span></div><h2>'+t("saleDone")+'</h2><div class="big">'+money(sale.total,sale.currency)+'</div><div class="muted" style="text-align:center">'+escapeHtml(sale.sale_number)+'</div><hr><div id="receiptItems"></div><hr><div>'+t("subtotal")+': '+money(sale.subtotal,sale.currency)+'</div><div>'+t("discount")+': '+money(sale.discount_amount,sale.currency)+'</div><div><strong>'+t("total")+': '+money(sale.total,sale.currency)+'</strong></div><div class="actions"><button id="printReceipt">'+t("print")+'</button><button class="secondary" id="receiptDone">'+t("newSale")+'</button></div></div>');
  const root=$("receiptItems");for(const item of items){const row=document.createElement("div");row.className="total-row";const name=document.createElement("span");name.textContent=item.product_name+(item.variant_name?" · "+item.variant_name:"")+" × "+(item.sale_unit==="kg"?(item.quantity*0.05).toFixed(2)+" kg":item.quantity+" قطعة");const amount=document.createElement("strong");amount.textContent=money(item.line_total,sale.currency);row.append(name,amount);root.append(row);}
  $("printReceipt").addEventListener("click",()=>window.print());$("receiptDone").addEventListener("click",closeModal);
 }
 load();
})();
</script>
