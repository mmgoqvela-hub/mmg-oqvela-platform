<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="MMG OQVELA - Multi-Store SaaS Platform">
  <title>MMG OQVELA | منصة المتاجر الذكية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .brand {
      color: #60a5fa;
      font-size: 15px;
      letter-spacing: 4px;
      direction: ltr;
      margin-bottom: 35px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .description {
      color: #aab7ca;
      font-size: 18px;
      line-height: 2;
      max-width: 650px;
      margin: auto;
    }

    .status {
      display: inline-block;
      margin-top: 38px;
      padding: 12px 22px;
      border: 1px solid #334155;
      border-radius: 30px;
      color: #93c5fd;
      font-size: 14px;
    }

    footer {
      margin-top: 65px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">MMG OQVELA</div>

    <h1>مستقبل التجارة يبدأ من هنا</h1>

    <p class="description">
      منصة تقنية متكاملة لإدارة المتاجر والأعمال التجارية،
      مصممة لتوفير تجربة ذكية ومرنة وقابلة للتوسع.
    </p>

    <div class="status">
      المنصة قيد التطوير
    </div>

    <footer>
      © 2026 MMG OQVELA. جميع الحقوق محفوظة.
    </footer>
  </main>
</body>
</html>
