<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>المتجر | MMG OQVELA</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f4f7fb;--surface:#fff;--ink:#172033;--muted:#68758a;--accent:#2867d8;--line:#e1e7f0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}
    button,input{font:inherit}
    .topbar{height:64px;padding:0 max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}
    .brand{font-weight:800;letter-spacing:.04em}.brand span{color:var(--accent)}
    .lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer}
    .container{max-width:1180px;margin:0 auto;padding:0 22px}
    .hero{padding:58px 0 40px}
    .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(32px,5vw,56px);line-height:1.12;margin:12px 0}
    .description{color:var(--muted);max-width:700px;line-height:1.9;margin:0}
    .platform-support{display:inline-flex;margin:12px 8px 0;padding:10px 15px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}.whatsapp{display:inline-flex;margin-top:20px;padding:11px 17px;border-radius:10px;background:#16875c;color:#fff;text-decoration:none;font-weight:700}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 25px}
    .search{flex:1;min-width:210px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}
    .filter{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--ink);cursor:pointer}
    .filter[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}
    .section-title{font-size:20px;margin:26px 0 14px}
    .cart-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0 26px}
    .cart-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .cart-count{background:var(--accent);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
    .cart-items{display:grid;gap:10px;margin-top:14px}
    .cart-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
    .cart-row strong{display:block}.cart-row small{color:var(--muted)}
    .cart-actions{display:flex;align-items:center;gap:7px}
    .cart-actions button,.add-cart{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
    .cart-actions button:disabled{opacity:.4;cursor:not-allowed}
    .cart-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;font-weight:800}
    .product-buy{display:grid;gap:9px;margin-top:14px}.quantity-stepper{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface)}.quantity-stepper button{width:38px;height:36px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer}.quantity-stepper input{width:76px;min-width:0;text-align:center;border:0!important;padding:6px!important;font-weight:800;background:transparent!important;color:var(--ink)}.quantity-stepper input:focus{outline:2px solid var(--accent);border-radius:6px}
    .product-buy select,.product-buy input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
    .add-cart{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
    .add-cart:disabled{opacity:.45;cursor:not-allowed}
    .cart-note{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0 0}
    .checkout-form{display:grid;gap:11px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
    .checkout-form label{display:grid;gap:6px;font-size:13px;font-weight:650}
    .checkout-form input,.checkout-form textarea,.checkout-form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
    .checkout-form textarea{min-height:76px;resize:vertical}
    .checkout-form button{padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
    .checkout-form button:disabled{opacity:.55;cursor:wait}
    .checkout-result{margin-top:14px;padding:14px;border-radius:10px;background:var(--bg);line-height:1.8;overflow-wrap:anywhere}
    .checkout-result[hidden]{display:none}
    .customer-orders-panel{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
    .customer-orders-panel .section-head h3{font-size:17px;margin:0}
    .customer-qr{display:flex;justify-content:center;align-items:center;min-height:20px;margin:12px auto}
    .customer-qr img,.customer-qr canvas{max-width:100%;height:auto!important}
    .customer-order{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)}
    .customer-order small{color:var(--muted);line-height:1.8}
    .customer-notice{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}
    .customer-notice.unread{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
    @media(max-width:620px){.cart-row{align-items:flex-start;flex-direction:column}.cart-actions{width:100%;justify-content:flex-end}}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:55px}
    .product{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
    .product-art{height:155px;background:linear-gradient(135deg,#dce8fb,#f4f7fb);display:grid;place-items:center;color:var(--accent);font-size:40px;font-weight:800}.product-art img{width:100%;height:100%;object-fit:cover;display:block}.product-art.has-image{background:var(--surface)}.product-thumbnails{display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding:2px}.product-thumbnails button{width:48px;height:48px;flex:0 0 48px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;cursor:pointer}.product-thumbnails button[aria-pressed=true]{border:2px solid var(--accent)}.product-thumbnails img{width:100%;height:100%;object-fit:cover;display:block}
    .product-body{padding:16px}
    .product h3{margin:0 0 7px;font-size:17px}
    .product p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
    .price{font-weight:800;font-size:18px}
    .compare{font-size:12px;color:var(--muted);text-decoration:line-through;margin-inline-start:8px}
    .variants{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:5px}
    .empty{grid-column:1/-1;padding:42px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    .status{padding:80px 20px;text-align:center;color:var(--muted)}
    footer{border-top:1px solid var(--line);padding:26px 18px;text-align:center;color:var(--muted);font-size:12px}
    [hidden]{display:none!important}
    body[data-template=classic]{--bg:#f4ecdf;--surface:#fffaf1;--ink:#35271e;--muted:#796657;--accent:#87552f;--line:#e5d7c5;font-family:Georgia,"Times New Roman",serif}
    body[data-template=classic] .hero{text-align:center;padding:72px 0 50px}
    body[data-template=classic] .description{margin:auto}
    body[data-template=classic] .product{border-radius:4px}
    body[data-template=minimal]{--bg:#fff;--surface:#fff;--ink:#171717;--muted:#777;--accent:#171717;--line:#e8e8e8}
    body[data-template=minimal] .topbar{border-bottom:2px solid var(--ink)}
    body[data-template=minimal] .product{border-radius:0;box-shadow:none}
    body[data-template=minimal] .product-art{border-bottom:1px solid var(--line);background:#f5f5f5}
    body[data-template=boutique]{--bg:#f7efeb;--surface:#fffaf8;--ink:#402e2b;--muted:#8a716c;--accent:#a35e58;--line:#eadbd6}
    body[data-template=boutique] .hero{padding:76px 0 54px}
    body[data-template=boutique] .product{border-radius:3px}
    body[data-template=boutique] .product-art{height:190px;background:linear-gradient(145deg,#ead1ca,#f9ece7)}
    body[data-template=tech]{color-scheme:dark;--bg:#0b1423;--surface:#111f33;--ink:#edf6ff;--muted:#a5b6cb;--accent:#39c8c2;--line:#243954}
    body[data-template=tech] .product-art{background:linear-gradient(135deg,#163d5a,#145c67);color:#a5fff3}
    body[data-template=tech] .topbar{background:var(--surface)}
    body[data-template=tech] .search{color:var(--ink)}
    body[data-template=tech] .empty{background:var(--surface)}
    body[data-template=market]{--bg:#eff8ef;--surface:#fff;--ink:#173b27;--muted:#66806d;--accent:#27834b;--line:#d7ead9}
    body[data-template=market] .hero{background:linear-gradient(120deg,#e0f3df,#f7fff4);padding:62px 30px 44px;border-radius:0 0 28px 28px}
    body[data-template=market] .product{border-radius:20px;box-shadow:0 8px 24px #245c1710}
    body[data-template=market] .product-art{background:linear-gradient(135deg,#d9f0d8,#f5fff0);color:#27834b}
    body[data-template=restaurant]{--bg:#211b19;--surface:#302522;--ink:#fff4e8;--muted:#c5aa97;--accent:#e18b54;--line:#514039;color-scheme:dark}
    body[data-template=restaurant] .hero{text-align:center;padding:78px 24px 58px;background:radial-gradient(ellipse at center,#523328,#211b19 70%)}
    body[data-template=restaurant] .description{margin:auto}
    body[data-template=restaurant] .product{border-radius:8px}
    body[data-template=restaurant] .product-art{background:linear-gradient(135deg,#523328,#74452e);color:#ffd4a6}
    body[data-template=fashion]{--bg:#f7f5f1;--surface:#fff;--ink:#24211f;--muted:#77716b;--accent:#24211f;--line:#e5e0d9;font-family:Georgia,"Times New Roman",serif}
    body[data-template=fashion] .hero{padding:82px 0 60px;border-bottom:1px solid var(--line)}
    body[data-template=fashion] h1{font-size:clamp(40px,7vw,76px);letter-spacing:-.04em}
    body[data-template=fashion] .product{border:0;border-radius:0;background:transparent}
    body[data-template=fashion] .product-art{height:230px;background:#e9e5df;color:#62564b}
    body[data-template=electronics]{color-scheme:dark;--bg:#0b1220;--surface:#121f33;--ink:#edf5ff;--muted:#9aacc3;--accent:#54d5e8;--line:#263c58}
    body[data-template=electronics] .hero{background:linear-gradient(115deg,#102f4b,#111d31);padding:62px 28px 44px;border:1px solid #254a68;border-radius:16px;margin-top:24px}
    body[data-template=electronics] .product{border-radius:10px;box-shadow:0 12px 28px #0003}
    body[data-template=electronics] .product-art{background:linear-gradient(135deg,#183d5c,#164c55);color:#8ceef0}
    body[data-template=beauty]{--bg:#fff4f5;--surface:#fff;--ink:#4c3039;--muted:#947681;--accent:#c46d8b;--line:#f0dce3}
    body[data-template=beauty] .hero{background:linear-gradient(135deg,#f9e3e9,#fff8f8);padding:68px 28px 48px;border-radius:24px}
    body[data-template=beauty] .product{border-radius:22px}
    body[data-template=beauty] .product-art{height:190px;background:linear-gradient(145deg,#f4d9e1,#fff0f3);color:#b45d7d}
    body[data-template=luxury]{color-scheme:dark;--bg:#11100f;--surface:#1d1a17;--ink:#f6edda;--muted:#b6a98d;--accent:#c9a45c;--line:#4b3d27;font-family:Georgia,"Times New Roman",serif}
    body[data-template=luxury] .topbar{background:#171411;border-bottom-color:#5b492d}
    body[data-template=luxury] .hero{padding:90px 0 65px;text-align:center}
    body[data-template=luxury] .description{margin:auto}
    body[data-template=luxury] .product{border-radius:2px;border-color:#5b492d}
    body[data-template=luxury] .product-art{height:205px;background:linear-gradient(145deg,#29231a,#51412a);color:#e3c47e}
    @media(max-width:620px){.hero{padding:38px 0 25px}.container{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-art{height:115px}.product-body{padding:12px}.product h3{font-size:15px}.toolbar{align-items:stretch}.search{min-width:100%}}
  .announcement-stack{display:grid;gap:12px;margin:18px auto;max-width:1100px;padding:0 16px}.platform-announcement{border:1px solid #d6dce5;border-inline-start:4px solid #64748b;border-radius:12px;padding:14px 16px;background:#f8fafc}.platform-announcement h3{margin:0 0 6px;font-size:1rem}.platform-announcement p{margin:0;white-space:pre-wrap}.announcement-success{border-inline-start-color:#16a34a}.announcement-warning{border-inline-start-color:#d97706}.announcement-urgent{border-inline-start-color:#dc2626}</style>
</head>
<body data-template="modern">
  <header class="topbar">
    <div class="brand">MMG <span>OQVELA</span></div>
    <button class="lang" id="languageToggle" type="button">English</button>
  </header>
  <main class="container">
    <section class="hero">
      <div class="eyebrow" id="businessType"></div>
      <img id="storeLogo" alt="Store logo" hidden style="max-width:150px;max-height:90px;object-fit:contain;margin:0 0 14px">
      <img id="storeHeroImage" alt="" hidden style="display:block;width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin:0 0 22px">
      <h1 id="storeName">جارٍ تحميل المتجر...</h1>
      <p class="description" id="storeDescription"></p>
      <a class="whatsapp" id="whatsappContact" hidden target="_blank" rel="noopener noreferrer"></a>
      <a class="platform-support" id="platformSupportContact" hidden target="_blank" rel="noopener noreferrer"></a>
    </section>
    <div id="storeAnnouncement" hidden style="margin:0 0 18px;padding:12px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700"></div>
    <section>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="ابحث في المنتجات..." aria-label="ابحث في المنتجات">
        <div id="storeCategoriesToolbar"><div class="filters" id="filters"></div></div>
      </div>
      <section class="cart-panel" id="storeCartSection" aria-labelledby="cartHeading">
        <div class="cart-head"><h2 class="section-title" id="cartHeading">سلة المشتريات</h2><span class="cart-count" id="cartCount">0</span></div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-total"><span id="cartTotalLabel">الإجمالي</span><span id="cartTotal">—</span></div>
        <p class="cart-note" id="cartNote">اختر المنتجات ثم أتمم طلبك.</p>
        <button class="add-cart" id="checkoutStart" type="button" hidden>إتمام الشراء</button>
        <form class="checkout-form" id="checkoutForm" hidden>
          <label><span id="customerNameLabel">الاسم الكامل</span><input id="customerName" name="customer_name" required minlength="2" maxlength="120" autocomplete="name"></label>
          <label><span id="customerPhoneLabel">رقم الهاتف</span><input id="customerPhone" name="customer_phone" required minlength="6" maxlength="30" autocomplete="tel"></label>
          <label><span id="customerEmailLabel">البريد الإلكتروني (اختياري)</span><input id="customerEmail" name="customer_email" type="email" maxlength="254" autocomplete="email"></label>
          <label><span id="addressLabel">العنوان / الموقع (إجباري)</span><textarea id="shippingAddress" name="shipping_address" required minlength="5" maxlength="1000" autocomplete="street-address" placeholder="اكتب عنوانك بالتفصيل أو أرسل موقعك"></textarea></label>
          <label><span id="fulfillmentLabel">طريقة الاستلام</span><select id="fulfillmentMethod" name="fulfillment_method" required></select></label>
          <label><span id="paymentMethodLabel">طريقة الدفع</span><select id="paymentMethod" name="payment_method" required></select></label>
          <div id="shamcashFields" hidden><p id="shamcashInstructions" class="cart-note"></p></div>
          <label><span id="customerNotesLabel">ملاحظات للمتجر (اختياري)</span><textarea id="customerNotes" name="customer_notes" maxlength="1000"></textarea></label>
          <button id="placeOrder" type="submit">تأكيد الطلب</button>
        </form>
        <div class="checkout-result" id="checkoutResult" role="status" hidden></div>
        <section class="customer-orders-panel" id="customerOrdersSection">
          <div class="section-head"><h3 id="customerOrdersHeading">طلباتي</h3><button class="lang" id="customerOrdersToggle" type="button">عرض طلباتي</button></div>
          <div id="customerOrdersPanel" hidden>
            <p class="cart-note" id="customerQrHint">احتفظ برمز QR لاستعادة سجل طلباتك عند تغيير الهاتف أو مسح بيانات المتصفح.</p>
            <div id="customerQr" class="customer-qr" aria-label="رمز استعادة سجل الزبون"></div>
            <div class="toolbar"><button class="lang" id="customerQrDownload" type="button">حفظ رمز QR في الهاتف</button><button class="lang" id="customerRefreshOrders" type="button">تحديث الطلبات</button></div>
            <div id="customerAccountTools" class="customer-notice">
              <p class="cart-note">يمكنك إنشاء حساب اختياري لتصل إلى طلباتك دون الاحتفاظ برمز QR.</p>
              <div class="toolbar"><button class="lang" id="customerRegisterOpen" type="button">إنشاء حساب</button><button class="lang" id="customerLoginOpen" type="button">تسجيل الدخول</button><button class="lang" id="customerLogout" type="button" hidden>تسجيل الخروج</button></div>
              <form id="customerAccountForm" class="checkout-form" hidden>
                <strong id="customerAccountFormTitle">إنشاء حساب</strong>
                <label id="customerAccountNameWrap"><span>الاسم الكامل</span><input id="customerAccountName" minlength="2" maxlength="120"></label>
                <label><span>رقم الهاتف</span><input id="customerAccountPhone" required minlength="6" maxlength="30" autocomplete="tel"></label>
                <label><span>كلمة المرور (10 أحرف على الأقل)</span><input id="customerAccountPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
                <button id="customerAccountSubmit" type="submit">إنشاء حساب</button>
              </form>
              <p id="customerAccountMessage" class="cart-note" role="status"></p>
            </div>
            <div id="customerNotifications" aria-live="polite"></div>
            <div id="customerOrdersList"></div>
          </div>
        </section>
      </section>
      <section id="storeProductsGridSection">
        <h2 class="section-title" id="productsHeading">المنتجات</h2>
        <div class="grid" id="products"></div>
      </section>
      <div class="status" id="status" role="status" hidden></div>
    </section>
  </main>
  <section id="platformAnnouncements" class="announcement-stack" aria-live="polite"></section>
  <footer id="platformFooter">© 2026 MMG OQVELA — جميع الحقوق محفوظة</footer>
  <script src="/assets/qrcode.min.js"></script>
  <script>
    (() => {
      const messages = {

          const message=document.createElement("p");message.textContent=item.message;
          row.append(title,message);
          if(!item.read_at){
            const read=document.createElement("button");read.type="button";read.className="lang";read.textContent=language==="ar"?"تمت القراءة":"Mark read";
            read.addEventListener("click",async()=>{await fetch(base+"notifications/"+encodeURIComponent(item.id)+"/read",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:"{}"});loadCustomerPortal();});
            row.append(read);
          }
          notices.append(row);
        }
      }
      let customerPortalTimer=null;
      function startCustomerPortalPolling(){
        if(customerPortalTimer)clearInterval(customerPortalTimer);
        if(customerToken())customerPortalTimer=setInterval(()=>{loadCustomerPortal().catch(()=>{});},10000);
      }

      async function submitOrder(event) {
        event.preventDefault();
        if (orderSubmitting || !cart.length) return;
        const currencies = new Set(cart.map(item => findCartProduct(item.productId)?.currency || "USD"));
        if (currencies.size > 1) { alert(t("mixedCurrency")); return; }
        const button = $("placeOrder");
        orderSubmitting = true;
        button.disabled = true;
        $("checkoutStart").disabled = true;
        $("cartItems").querySelectorAll("button").forEach(control => { control.disabled = true; });
        button.textContent = t("placing");
        const body = {
          customer_name:$("customerName").value.trim(),
          customer_phone:$("customerPhone").value.trim(),
          customer_email:$("customerEmail").value.trim() || null,
          shipping_address:$("shippingAddress").value.trim() || null,
          customer_notes:$("customerNotes").value.trim() || null,
          payment_method:$("paymentMethod").value,
          fulfillment_method:$("fulfillmentMethod").value,
          customer_access_token:localStorage.getItem(customerTokenStorageKey) || null,
          items:cart.map(item => ({product_id:item.productId,variant_id:item.variantId,quantity:item.quantity}))
        };
        try {
          const response = await fetch("/api/public/stores/" + encodeURIComponent(slug) + "/orders", {
            method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || t("orderFailed"));
          cart = [];
          saveCart();
          renderCart();
          $("checkoutForm").hidden = true;
          const result = $("checkoutResult");
          result.replaceChildren();
          const heading = document.createElement("strong");
          heading.textContent = t("orderSuccess") + " — " + t("orderNumber") + ": " + data.order.order_number;
          const status = document.createElement("p");
          status.textContent = t("orderPending");
          result.append(heading,status);
          if (data.order.customer_access_token) {
            localStorage.setItem(customerTokenStorageKey,data.order.customer_access_token);
            if(!localStorage.getItem(customerModeStorageKey))localStorage.setItem(customerModeStorageKey,"guest");
            renderCustomerQr();
            loadCustomerPortal();
            startCustomerPortalPolling();
          }
          if (data.order.shamcash) {
            const pay = document.createElement("p");
            pay.textContent = t("shamcashPay") + " " + data.order.shamcash.recipient +
              (data.order.shamcash.instructions ? " — " + data.order.shamcash.instructions : "");
            result.append(pay);
          }
          result.hidden = false;
        } catch(error) {
          alert(error.message || t("orderFailed"));
        } finally {
          orderSubmitting = false;
          button.disabled = false;
          $("checkoutStart").disabled = false;
          $("cartItems").querySelectorAll("button").forEach(control => { control.disabled = false; });
          button.textContent = t("placeOrder");
        }
      }

      function renderProducts() {
        const container = $("products");
        container.replaceChildren();
        const query = $("search").value.trim().toLocaleLowerCase(language);
        const filtered = storeData.products.filter(product => {
          const categoryMatch = !categoryFilter || product.category_id === categoryFilter;
          const searchMatch = !query || (product.name + " " + (product.description || "")).toLocaleLowerCase(language).includes(query);
          return categoryMatch && searchMatch;
        });
        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = t("empty");
          container.append(empty);
          return;
        }
        for (const product of filtered) {
          const card = document.createElement("article");
          card.className = "product";
          const art = document.createElement("div");
          art.className = "product-art";
          art.setAttribute("aria-hidden","true");
          const productImages = Array.isArray(product.images) ? product.images.filter(item => item && typeof item.url === "string" && (item.url.startsWith("/media/") || /^https:\/\//i.test(item.url))) : [];
          let coverImage = null;
          const productImage = productImages[0];
          if (productImage) {
            coverImage = document.createElement("img");
            coverImage.src = productImage.url;
            coverImage.alt = productImage.alt_text || product.name;
            coverImage.loading = "lazy";
            coverImage.decoding = "async";
            coverImage.addEventListener("error", () => {
              art.classList.remove("has-image");
              coverImage.remove();
              coverImage = null;
              art.textContent = product.product_type === "service" ? "✦" : product.product_type === "digital" ? "⌘" : "◇";
            }, { once:true });
            art.classList.add("has-image");
            art.removeAttribute("aria-hidden");
            art.append(coverImage);
          } else {
            art.textContent = product.product_type === "service" ? "✦" : product.product_type === "digital" ? "⌘" : "◇";
          }
          const body = document.createElement("div");
          body.className = "product-body";
          if (coverImage && productImages.length > 1) {
            const thumbnails = document.createElement("div");
            thumbnails.className = "product-thumbnails";
            thumbnails.setAttribute("aria-label",t("productImages") || "Product images");
            productImages.forEach((entry,index) => {
              const thumbnailButton = document.createElement("button");
              thumbnailButton.type = "button";
              thumbnailButton.setAttribute("aria-label",(entry.alt_text || product.name) + " " + (index + 1));
              thumbnailButton.setAttribute("aria-pressed",index === 0 ? "true" : "false");
              const thumbnail = document.createElement("img");
              thumbnail.src = entry.url;
              thumbnail.alt = "";
              thumbnail.loading = "lazy";
              thumbnailButton.append(thumbnail);
              thumbnailButton.addEventListener("click",() => {
                if (!coverImage) return;
                coverImage.src = entry.url;
                coverImage.alt = entry.alt_text || product.name;
                thumbnails.querySelectorAll("button").forEach((button,buttonIndex) => button.setAttribute("aria-pressed",buttonIndex === index ? "true" : "false"));
              });
              thumbnails.append(thumbnailButton);
            });
            body.append(thumbnails);
          }
          const name = document.createElement("h3");
          name.textContent = product.name;
          const description = document.createElement("p");
          description.textContent = product.description || "";
          const priceLine = document.createElement("div");
          priceLine.className = "price";
          priceLine.textContent = money(product.base_price,product.currency) + (product.sale_unit === "kg" ? (language === "ar" ? " / كغ" : " / kg") : (language === "ar" ? " / قطعة" : " / piece"));
          const tierList = document.createElement("div");
          tierList.className = "pricing-tiers";
          const appendTierPrices = (tiers) => {
            tierList.replaceChildren();
            for (const tier of tiers || []) {
              const tierLine = document.createElement("small");
              const tierLabel = tier.tier_code === "bulk_wholesale" ? (language === "ar" ? "جملة الجملة" : "Bulk wholesale") :
                tier.tier_code === "wholesale" ? (language === "ar" ? "الجملة" : "Wholesale") :
                (language === "ar" ? "المفرق" : "Retail");
              tierLine.textContent = tierLabel + " · " + (language === "ar" ? "ابتداءً من " : "From ") +
                tier.min_quantity + " · " + money(tier.unit_price,product.currency);
              tierList.append(tierLine);
            }
          };
          appendTierPrices(product.public_tier_prices);
          if (product.compare_at_price && product.compare_at_price > product.base_price) {
            const compare = document.createElement("span");
            compare.className = "compare";
            compare.textContent = money(product.compare_at_price,product.currency);
            priceLine.append(compare);
          }
          body.append(name);
          if (product.is_featured) {
            const featured = document.createElement("p");
            featured.textContent = t("featured");
            body.append(featured);
          }
          if (description.textContent) body.append(description);
          body.append(priceLine);
          if (tierList.childElementCount) body.append(tierList);
          if (product.variants?.length) {
            const variants = document.createElement("div");
            variants.className = "variants";
            for (const variant of product.variants) {
              const line = document.createElement("span");
              const variantTiers = variant.public_tier_prices?.length ? variant.public_tier_prices : product.public_tier_prices;
              const variantStartingPrice = variantTiers?.[0]?.unit_price ?? variant.price;
              line.textContent = variant.name + " · " + money(variantStartingPrice,product.currency) +
                (product.track_inventory ? " · " + t("stock") + ": " + variant.stock_quantity : "");
              variants.append(line);
            }
            body.append(variants);
          }
          const buy = document.createElement("div");
          buy.className = "product-buy";
          let variantSelect = null;
          if (product.variants?.length) {
            variantSelect = document.createElement("select");
            variantSelect.setAttribute("aria-label",t("variant"));
            const placeholder = document.createElement("option");
            placeholder.value = ""; placeholder.textContent = t("variant");
            variantSelect.append(placeholder);
            for (const variant of product.variants) {
              const option = document.createElement("option");
              option.value = variant.id;
              const optionTiers = variant.public_tier_prices?.length ? variant.public_tier_prices : product.public_tier_prices;
              option.textContent = variant.name + " · " + money(optionTiers?.[0]?.unit_price ?? variant.price,product.currency);
              option.disabled = product.track_inventory && Number(variant.stock_quantity) <= 0;
              variantSelect.append(option);
            }
            buy.append(variantSelect);
          }
          const step = product.sale_unit === "kg" ? 0.05 : 1;
          const quantityWrap = document.createElement("div");
          quantityWrap.className = "quantity-stepper";
          quantityWrap.setAttribute("role","group");
          quantityWrap.setAttribute("aria-label",t("quantity"));
          const decrease = document.createElement("button");
          decrease.type = "button"; decrease.textContent = "−";
          decrease.setAttribute("aria-label",language === "ar" ? "تقليل الكمية" : "Decrease quantity");
          const quantity = document.createElement("input");
          quantity.type = "number"; quantity.min = product.sale_unit === "kg" ? "0.05" : "1"; quantity.step = String(step); quantity.value = product.sale_unit === "kg" ? "0.25" : "1";
          quantity.inputMode = "decimal"; quantity.setAttribute("aria-label",t("quantity") + (product.sale_unit === "kg" ? (language === "ar" ? " بالكيلوغرام" : " in kilograms") : ""));
          if (product.track_inventory && !product.variants?.length) quantity.max = product.sale_unit === "kg" ? String(Number(product.stock_quantity)/1000) : String(product.stock_quantity);
          const increase = document.createElement("button");
          increase.type = "button"; increase.textContent = "+";
          increase.setAttribute("aria-label",language === "ar" ? "زيادة الكمية" : "Increase quantity");
          const normalizeQuantity = () => {
            const raw = Number(quantity.value);
            const min = product.sale_unit === "kg" ? 0.05 : 1;
            const max = product.track_inventory && !product.variants?.length ? (product.sale_unit === "kg" ? Number(product.stock_quantity)/1000 : Number(product.stock_quantity)) : Infinity;
            const safe = Number.isFinite(raw) ? Math.max(min,Math.min(max,raw)) : min;
            const snapped = Math.round(safe/step)*step;
            quantity.value = product.sale_unit === "kg" ? snapped.toFixed(2) : String(Math.round(snapped));
            updateDisplayedPrice();
          };
          decrease.addEventListener("click",() => { quantity.value = String(Math.max(Number(quantity.min),Number(quantity.value)-step)); normalizeQuantity(); });
          increase.addEventListener("click",() => { quantity.value = String(Number(quantity.value)+step); normalizeQuantity(); });
          quantity.addEventListener("change",normalizeQuantity);
          quantityWrap.append(decrease,quantity,increase);
          buy.append(quantityWrap);
          const add = document.createElement("button");
          add.type = "button"; add.className = "add-cart"; add.textContent = t("add");
          const noStock = product.track_inventory && (product.variants?.length
            ? product.variants.every(option => Number(option.stock_quantity) <= 0)
            : Number(product.stock_quantity) <= 0);
          add.disabled = noStock;
          if (noStock) add.textContent = t("outOfStock");
          add.addEventListener("click",() => {
            const enteredAmount = Number(quantity.value);
            const amount = product.sale_unit === "kg" ? Math.round(enteredAmount * 1000) : enteredAmount;
            const variant = variantSelect ? product.variants.find(option => option.id === variantSelect.value) : null;
            if (!Number.isInteger(amount) || amount < (product.sale_unit === "kg" ? 50 : 1) || (product.sale_unit === "kg" && amount % 50 !== 0) || (product.sale_unit !== "kg" && amount > 999) || (variantSelect && !variant)) {
              quantity.focus(); return;
            }
            addToCart(product,variant,amount);
          });
          const updateDisplayedPrice = () => {
            const amount = product.sale_unit === "kg" ? Math.max(0.05,Number(quantity.value)||0.25) : Math.max(1,Number(quantity.value)||1);
            const selectedVariant = variantSelect ? product.variants.find(option => option.id === variantSelect.value) : null;
            const tiers = selectedVariant?.public_tier_prices?.length ? selectedVariant.public_tier_prices : product.public_tier_prices;
            if (Array.isArray(tiers) && tiers.length) {
              const selectedTier = tiers.filter(tier => amount >= tier.min_quantity).sort((a,b)=>b.min_quantity-a.min_quantity)[0];
              const unitPrice = selectedTier?.unit_price ?? (selectedVariant?.price ?? product.base_price);
              priceLine.textContent = money(unitPrice,product.currency) + (product.sale_unit === "kg" ? (language === "ar" ? " / كغ" : " / kg") : (language === "ar" ? " / قطعة" : " / piece")) + (selectedTier ? " · " + selectedTier.min_quantity + "+" : "");
            }
          };
          quantity.addEventListener("input",updateDisplayedPrice);
          if (variantSelect) variantSelect.addEventListener("change",updateDisplayedPrice);
          updateDisplayedPrice();
          buy.append(add);
          body.append(buy);
          card.append(art,body);
          container.append(card);
        }
      }

      function renderCategories() {
        const filters = $("filters");
        filters.replaceChildren();
        const all = document.createElement("button");
        all.className = "filter";
        all.type = "button";
        all.textContent = t("all");
        all.setAttribute("aria-pressed",String(!categoryFilter));
        all.addEventListener("click",() => {categoryFilter="";renderCategories();renderProducts();});
        filters.append(all);
        for (const category of storeData.categories) {
          const button = document.createElement("button");
          button.className = "filter";
          button.type = "button";
          button.textContent = category.name;
          button.setAttribute("aria-pressed",String(categoryFilter === category.id));
          button.addEventListener("click",() => {categoryFilter=category.id;renderCategories();renderProducts();});
          filters.append(button);
        }
      }

      async function load() {
        try {
          const response = await fetch("/api/public/stores/" + encodeURIComponent(slug),{headers:{"Accept":"application/json"}});
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            $("status").hidden = false;
            $("status").textContent = response.status === 404 ? t("unavailable") : t("failed");
            $("storeName").textContent = "";
            return;
          }
          storeData = data;
          $("productsHeading").textContent = t("products");
          renderAnnouncements();
          renderCheckoutMethods();
          updateFulfillmentOptions();
          document.title = data.store.name + " | MMG OQVELA";
          document.body.dataset.template = ["modern","classic","minimal","boutique","tech","market","restaurant","fashion","electronics","beauty","luxury"].includes(data.store.template_key) ? data.store.template_key : "modern";
          const customization = data.store.customization && typeof data.store.customization === "object" ? data.store.customization : {};
          const colors = customization.colors || {};
          const safeColor = value => typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
          const colorVariables = {
            primary: "--accent",
            background: "--bg",
            text: "--ink",
            surface: "--surface",
            muted: "--muted",
            border: "--line"
          };
          for (const [key, variable] of Object.entries(colorVariables)) {
            if (safeColor(colors[key])) document.body.style.setProperty(variable, colors[key]);
          }
          const fonts = {system:'system-ui,-apple-system,"Segoe UI",sans-serif',cairo:'Cairo,system-ui,sans-serif',tajawal:'Tajawal,system-ui,sans-serif',serif:'Georgia,"Times New Roman",serif'};
          document.body.style.fontFamily = fonts[customization.fonts?.family] || fonts.system;
          $("businessType").textContent = data.store.business_type || "";
          $("storeName").textContent = customization.texts?.heroTitle || data.store.name;
          $("storeDescription").textContent = customization.texts?.heroSubtitle || data.store.description || "";
          const logo = $("storeLogo");
          if (typeof customization.logo === "string" && /^https?:/i.test(customization.logo)) {
            logo.src = customization.logo; logo.hidden = false;
            logo.addEventListener("error",() => { logo.hidden = true; },{once:true});
          }
          if (typeof customization.announcement === "string" && customization.announcement.trim()) {
            $("storeAnnouncement").textContent = customization.announcement.trim();
            $("storeAnnouncement").hidden = false;
          }
          const heroImage = $("storeHeroImage");
          if (typeof customization.heroImage === "string" && /^https?:/i.test(customization.heroImage)) {
            heroImage.src = customization.heroImage;
            heroImage.loading = "lazy";
            heroImage.decoding = "async";
            heroImage.hidden = false;
            heroImage.addEventListener("error",() => { heroImage.hidden = true; },{once:true});
          }
          const heroAlignment = customization.layout?.heroAlignment === "center" ? "center" : "right";
          document.querySelector(".hero").style.textAlign = heroAlignment;
          const sections = customization.sections || {};
          $("storeProductsGridSection").hidden = sections.products === false;
          $("storeCartSection").hidden = sections.cart === false;
          $("storeCategoriesToolbar").hidden = sections.categories === false;
          const supportPhone = String(data.platform_support_whatsapp || "").replace(/\D/g,"");
          if (/^\d{8,15}$/.test(supportPhone)) {
            $("platformSupportContact").href = "https://wa.me/" + supportPhone;
            $("platformSupportContact").hidden = false;
          }
          const phone = String(data.store.whatsapp_phone || "").replace(/\D/g,"");
          if (/^\d{8,15}$/.test(phone)) {
            $("whatsappContact").href = "https://wa.me/" + phone;
            $("whatsappContact").hidden = false;
          }
          $("status").hidden = true;
          renderCategories();
          renderProducts();
          renderCart();
        } catch {
          $("status").hidden = false;
          $("status").textContent = t("failed");
        }
      }

      $("customerRegisterOpen").addEventListener("click",()=>openCustomerAccountForm("register"));
      $("customerLoginOpen").addEventListener("click",()=>openCustomerAccountForm("login"));
      $("customerAccountForm").addEventListener("submit",submitCustomerAccount);
      $("customerLogout").addEventListener("click",logoutCustomerAccount);
      $("customerOrdersToggle").addEventListener("click",()=>{
        const panel=$("customerOrdersPanel");
        panel.hidden=!panel.hidden;
        $("customerOrdersToggle").textContent=panel.hidden?t("showOrders"):t("hideOrders");
        if(!panel.hidden)loadCustomerPortal().catch(()=>{});
      });
      $("customerRefreshOrders").addEventListener("click",()=>loadCustomerPortal().catch(()=>{}));
      $("customerQrDownload").addEventListener("click",()=>{
        const canvas=$("customerQr").querySelector("canvas");
        const image=$("customerQr").querySelector("img");
        const url=canvas?canvas.toDataURL("image/png"):image?.src;
        if(!url)return;
        const link=document.createElement("a");link.href=url;link.download="mmg-customer-recovery-qr.png";link.click();
      });
      $("languageToggle").addEventListener("click",() => setLanguage(language === "ar" ? "en" : "ar"));
      $("search").addEventListener("input",renderProducts);
      $("checkoutStart").addEventListener("click",() => { renderCheckoutMethods(); $("checkoutForm").hidden = false; $("checkoutResult").hidden = true; $("customerName").focus(); });
      $("paymentMethod").addEventListener("change",updateShamcashFields);
      $("fulfillmentMethod").addEventListener("change",()=>{updateFulfillmentOptions();renderCart();});
      $("checkoutForm").addEventListener("submit",submitOrder);
      setLanguage(language);
      $("customerOrdersHeading").textContent=t("customerOrders");
      $("customerQrHint").textContent=t("qrHint");
      $("customerRefreshOrders").textContent=t("refreshOrders");
      $("customerOrdersToggle").textContent=t("showOrders");
      $("storeName").textContent = t("loading");
      load();
      startCustomerPortalPolling();
    })();
  </script>
</body>
</html>
