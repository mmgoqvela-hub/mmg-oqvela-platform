<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>المتجر | MMG OQVELA</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f4f7fb;--surface:#fff;--ink:#172033;--muted:#68758a;--accent:#2867d8;--line:#e1e7f0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}
    button,input{font:inherit}
    .topbar{height:64px;padding:0 max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}
    .brand{font-weight:800;letter-spacing:.04em}.brand span{color:var(--accent)}
    .lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer}
    .container{max-width:1180px;margin:0 auto;padding:0 22px}
    .hero{padding:58px 0 40px}
    .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(32px,5vw,56px);line-height:1.12;margin:12px 0}
    .description{color:var(--muted);max-width:700px;line-height:1.9;margin:0}
    .whatsapp{display:inline-flex;margin-top:20px;padding:11px 17px;border-radius:10px;background:#16875c;color:#fff;text-decoration:none;font-weight:700}
    .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 25px}
    .search{flex:1;min-width:210px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}
    .filter{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--ink);cursor:pointer}
    .filter[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}
    .section-title{font-size:20px;margin:26px 0 14px}
    .cart-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0 26px}
    .cart-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .cart-count{background:var(--accent);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
    .cart-items{display:grid;gap:10px;margin-top:14px}
    .cart-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
    .cart-row strong{display:block}.cart-row small{color:var(--muted)}
    .cart-actions{display:flex;align-items:center;gap:7px}
    .cart-actions button,.add-cart{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer}
    .cart-actions button:disabled{opacity:.4;cursor:not-allowed}
    .cart-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;font-weight:800}
    .product-buy{display:grid;gap:9px;margin-top:14px}
    .product-buy select,.product-buy input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
    .add-cart{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
    .add-cart:disabled{opacity:.45;cursor:not-allowed}
    .cart-note{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0 0}
    @media(max-width:620px){.cart-row{align-items:flex-start;flex-direction:column}.cart-actions{width:100%;justify-content:flex-end}}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:55px}
    .product{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
    .product-art{height:155px;background:linear-gradient(135deg,#dce8fb,#f4f7fb);display:grid;place-items:center;color:var(--accent);font-size:40px;font-weight:800}
    .product-body{padding:16px}
    .product h3{margin:0 0 7px;font-size:17px}
    .product p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
    .price{font-weight:800;font-size:18px}
    .compare{font-size:12px;color:var(--muted);text-decoration:line-through;margin-inline-start:8px}
    .variants{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:5px}
    .empty{grid-column:1/-1;padding:42px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    .status{padding:80px 20px;text-align:center;color:var(--muted)}
    footer{border-top:1px solid var(--line);padding:26px 18px;text-align:center;color:var(--muted);font-size:12px}
    [hidden]{display:none!important}
    body[data-template=classic]{--bg:#f4ecdf;--surface:#fffaf1;--ink:#35271e;--muted:#796657;--accent:#87552f;--line:#e5d7c5;font-family:Georgia,"Times New Roman",serif}
    body[data-template=classic] .hero{text-align:center;padding:72px 0 50px}
    body[data-template=classic] .description{margin:auto}
    body[data-template=classic] .product{border-radius:4px}
    body[data-template=minimal]{--bg:#fff;--surface:#fff;--ink:#171717;--muted:#777;--accent:#171717;--line:#e8e8e8}
    body[data-template=minimal] .topbar{border-bottom:2px solid var(--ink)}
    body[data-template=minimal] .product{border-radius:0;box-shadow:none}
    body[data-template=minimal] .product-art{border-bottom:1px solid var(--line);background:#f5f5f5}
    body[data-template=boutique]{--bg:#f7efeb;--surface:#fffaf8;--ink:#402e2b;--muted:#8a716c;--accent:#a35e58;--line:#eadbd6}
    body[data-template=boutique] .hero{padding:76px 0 54px}
    body[data-template=boutique] .product{border-radius:3px}
    body[data-template=boutique] .product-art{height:190px;background:linear-gradient(145deg,#ead1ca,#f9ece7)}
    body[data-template=tech]{color-scheme:dark;--bg:#0b1423;--surface:#111f33;--ink:#edf6ff;--muted:#a5b6cb;--accent:#39c8c2;--line:#243954}
    body[data-template=tech] .product-art{background:linear-gradient(135deg,#163d5a,#145c67);color:#a5fff3}
    body[data-template=tech] .topbar{background:var(--surface)}
    body[data-template=tech] .search{color:var(--ink)}
    body[data-template=tech] .empty{background:var(--surface)}
    body[data-template=market]{--bg:#eff8ef;--surface:#fff;--ink:#173b27;--muted:#66806d;--accent:#27834b;--line:#d7ead9}
    body[data-template=market] .hero{background:linear-gradient(120deg,#e0f3df,#f7fff4);padding:62px 30px 44px;border-radius:0 0 28px 28px}
    body[data-template=market] .product{border-radius:20px;box-shadow:0 8px 24px #245c1710}
    body[data-template=market] .product-art{background:linear-gradient(135deg,#d9f0d8,#f5fff0);color:#27834b}
    body[data-template=restaurant]{--bg:#211b19;--surface:#302522;--ink:#fff4e8;--muted:#c5aa97;--accent:#e18b54;--line:#514039;color-scheme:dark}
    body[data-template=restaurant] .hero{text-align:center;padding:78px 24px 58px;background:radial-gradient(ellipse at center,#523328,#211b19 70%)}
    body[data-template=restaurant] .description{margin:auto}
    body[data-template=restaurant] .product{border-radius:8px}
    body[data-template=restaurant] .product-art{background:linear-gradient(135deg,#523328,#74452e);color:#ffd4a6}
    body[data-template=fashion]{--bg:#f7f5f1;--surface:#fff;--ink:#24211f;--muted:#77716b;--accent:#24211f;--line:#e5e0d9;font-family:Georgia,"Times New Roman",serif}
    body[data-template=fashion] .hero{padding:82px 0 60px;border-bottom:1px solid var(--line)}
    body[data-template=fashion] h1{font-size:clamp(40px,7vw,76px);letter-spacing:-.04em}
    body[data-template=fashion] .product{border:0;border-radius:0;background:transparent}
    body[data-template=fashion] .product-art{height:230px;background:#e9e5df;color:#62564b}
    body[data-template=electronics]{color-scheme:dark;--bg:#0b1220;--surface:#121f33;--ink:#edf5ff;--muted:#9aacc3;--accent:#54d5e8;--line:#263c58}
    body[data-template=electronics] .hero{background:linear-gradient(115deg,#102f4b,#111d31);padding:62px 28px 44px;border:1px solid #254a68;border-radius:16px;margin-top:24px}
    body[data-template=electronics] .product{border-radius:10px;box-shadow:0 12px 28px #0003}
    body[data-template=electronics] .product-art{background:linear-gradient(135deg,#183d5c,#164c55);color:#8ceef0}
    body[data-template=beauty]{--bg:#fff4f5;--surface:#fff;--ink:#4c3039;--muted:#947681;--accent:#c46d8b;--line:#f0dce3}
    body[data-template=beauty] .hero{background:linear-gradient(135deg,#f9e3e9,#fff8f8);padding:68px 28px 48px;border-radius:24px}
    body[data-template=beauty] .product{border-radius:22px}
    body[data-template=beauty] .product-art{height:190px;background:linear-gradient(145deg,#f4d9e1,#fff0f3);color:#b45d7d}
    body[data-template=luxury]{color-scheme:dark;--bg:#11100f;--surface:#1d1a17;--ink:#f6edda;--muted:#b6a98d;--accent:#c9a45c;--line:#4b3d27;font-family:Georgia,"Times New Roman",serif}
    body[data-template=luxury] .topbar{background:#171411;border-bottom-color:#5b492d}
    body[data-template=luxury] .hero{padding:90px 0 65px;text-align:center}
    body[data-template=luxury] .description{margin:auto}
    body[data-template=luxury] .product{border-radius:2px;border-color:#5b492d}
    body[data-template=luxury] .product-art{height:205px;background:linear-gradient(145deg,#29231a,#51412a);color:#e3c47e}
    @media(max-width:620px){.hero{padding:38px 0 25px}.container{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-art{height:115px}.product-body{padding:12px}.product h3{font-size:15px}.toolbar{align-items:stretch}.search{min-width:100%}}
  </style>
</head>
<body data-template="modern">
  <header class="topbar">
    <div class="brand">MMG <span>OQVELA</span></div>
    <button class="lang" id="languageToggle" type="button">English</button>
  </header>
  <main class="container">
    <section class="hero">
      <div class="eyebrow" id="businessType"></div>
      <h1 id="storeName">جارٍ تحميل المتجر...</h1>
      <p class="description" id="storeDescription"></p>
      <a class="whatsapp" id="whatsappContact" hidden target="_blank" rel="noopener noreferrer"></a>
    </section>
    <section>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="ابحث في المنتجات..." aria-label="ابحث في المنتجات">
        <div class="filters" id="filters"></div>
      </div>
      <section class="cart-panel" aria-labelledby="cartHeading">
        <div class="cart-head"><h2 class="section-title" id="cartHeading">سلة المشتريات</h2><span class="cart-count" id="cartCount">0</span></div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-total"><span id="cartTotalLabel">الإجمالي</span><span id="cartTotal">—</span></div>
        <p class="cart-note" id="cartNote">تُحفظ السلة على هذا الجهاز. إتمام الطلب سيُتاح بعد تحديد خيارات الدفع والتسليم الخاصة بالمتجر.</p>
      </section>
      <h2 class="section-title" id="productsHeading">المنتجات</h2>
      <div class="grid" id="products"></div>
      <div class="status" id="status" role="status" hidden></div>
    </section>
  </main>
  <footer id="platformFooter">© 2026 MMG OQVELA — جميع الحقوق محفوظة</footer>
  <script>
    (() => {
      const messages = {
        ar:{loading:"جارٍ تحميل المتجر...",products:"المنتجات",search:"ابحث في المنتجات...",all:"الكل",empty:"لم يتم نشر منتجات بعد.",unavailable:"هذا المتجر غير متاح حالياً.",failed:"تعذر تحميل المتجر. حاول تحديث الصفحة.",featured:"منتج مميز",contact:"اتصل بنا عبر واتساب",back:"العودة إلى الصفحة الرئيسية",footer:"© 2026 MMG OQVELA — جميع الحقوق محفوظة",cart:"سلة المشتريات",total:"الإجمالي",emptyCart:"سلتك فارغة حالياً.",add:"أضف إلى السلة",added:"تمت إضافة المنتج إلى السلة.",variant:"اختر الخيار",quantity:"الكمية",remove:"إزالة",cartNote:"تُحفظ السلة على هذا الجهاز. إتمام الطلب سيُتاح بعد تحديد خيارات الدفع والتسليم الخاصة بالمتجر.",stock:"المتاح",outOfStock:"نفد المخزون",invalidQuantity:"الكمية المطلوبة تتجاوز المخزون المتاح."},
        en:{loading:"Loading store...",products:"Products",search:"Search products...",all:"All",empty:"No products have been published yet.",unavailable:"This store is currently unavailable.",failed:"Unable to load this store. Please refresh the page.",featured:"Featured",contact:"Contact us on WhatsApp",back:"Back to home",footer:"© 2026 MMG OQVELA — All rights reserved",cart:"Shopping cart",total:"Total",emptyCart:"Your cart is empty.",add:"Add to cart",added:"Product added to cart.",variant:"Choose an option",quantity:"Quantity",remove:"Remove",cartNote:"Your cart is saved on this device. Checkout will be enabled after this store's payment and delivery options are defined.",stock:"Available",outOfStock:"Out of stock",invalidQuantity:"Requested quantity exceeds available stock."}
      };
      let language = localStorage.getItem("mmg_language") === "en" ? "en" : "ar";
      let storeData = null;
      let categoryFilter = "";
      const cartStorageKey = "mmg_cart_" + slug;
      let cart = [];
      try {
        const saved = JSON.parse(localStorage.getItem(cartStorageKey) || "[]");
        if (Array.isArray(saved)) cart = saved.filter(item => item && typeof item.productId === "string" && Number.isInteger(item.quantity) && item.quantity > 0);
      } catch { cart = []; }
      const $ = id => document.getElementById(id);
      const t = key => messages[language][key] || key;
      const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");

      function setLanguage(next) {
        language = next;
        localStorage.setItem("mmg_language",language);
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        $("languageToggle").textContent = language === "ar" ? "English" : "العربية";
        $("productsHeading").textContent = t("products");
        $("search").placeholder = t("search");
        $("search").setAttribute("aria-label",t("search"));
        $("platformFooter").textContent = t("footer");
        $("whatsappContact").textContent = t("contact");
        $("cartHeading").textContent = t("cart");
        $("cartTotalLabel").textContent = t("total");
        $("cartNote").textContent = t("cartNote");
        if (storeData) { renderProducts(); renderCart(); }
      }

      function money(amount,currency) {
        try {
          return new Intl.NumberFormat(language === "ar" ? "ar" : "en", {
            style:"currency",currency:currency || "USD",maximumFractionDigits:2
          }).format(Number(amount || 0));
        } catch {
          return Number(amount || 0).toFixed(2) + " " + (currency || "USD");
        }
      }

      function saveCart() {
        try { localStorage.setItem(cartStorageKey, JSON.stringify(cart)); } catch {}
      }

      function findCartProduct(productId) {
        return storeData?.products.find(product => product.id === productId);
      }

      function cartLinePrice(item) {
        const product = findCartProduct(item.productId);
        const variant = product?.variants?.find(option => option.id === item.variantId);
        return Number(variant?.price ?? product?.base_price ?? 0);
      }

      function renderCart() {
        const container = $("cartItems");
        container.replaceChildren();
        const valid = cart.filter(item => findCartProduct(item.productId));
        if (valid.length !== cart.length) { cart = valid; saveCart(); }
        const count = cart.reduce((sum,item) => sum + item.quantity,0);
        $("cartCount").textContent = String(count);
        if (!cart.length) {
          const empty = document.createElement("p");
          empty.className = "cart-note";
          empty.textContent = t("emptyCart");
          container.append(empty);
          $("cartTotal").textContent = "—";
          return;
        }
        const totals = new Map();
        for (const item of cart) {
          const product = findCartProduct(item.productId);
          const variant = product?.variants?.find(option => option.id === item.variantId);
          const price = cartLinePrice(item);
          const currency = product.currency || "USD";
          totals.set(currency, (totals.get(currency) || 0) + price * item.quantity);
          const row = document.createElement("div");
          row.className = "cart-row";
          const info = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = product.name;
          const detail = document.createElement("small");
          detail.textContent = (variant ? variant.name + " · " : "") + money(price,product.currency);
          info.append(name,detail);
          const actions = document.createElement("div");
          actions.className = "cart-actions";
          const minus = document.createElement("button");
          minus.type = "button"; minus.textContent = "−";
          minus.setAttribute("aria-label",language === "ar" ? "تقليل الكمية" : "Decrease quantity");
          minus.addEventListener("click",() => changeCartQuantity(item,-1));
          const qty = document.createElement("span");
          qty.textContent = String(item.quantity);
          const plus = document.createElement("button");
          plus.type = "button"; plus.textContent = "+";
          plus.setAttribute("aria-label",language === "ar" ? "زيادة الكمية" : "Increase quantity");
          const stock = variant ? Number(variant.stock_quantity) : Number(product.stock_quantity);
          const tracked = Boolean(product.track_inventory);
          plus.disabled = tracked && item.quantity >= stock;
          plus.addEventListener("click",() => changeCartQuantity(item,1));
          const remove = document.createElement("button");
          remove.type = "button"; remove.textContent = t("remove");
          remove.addEventListener("click",() => { cart = cart.filter(line => line !== item); saveCart(); renderCart(); });
          actions.append(minus,qty,plus,remove);
          row.append(info,actions);
          container.append(row);
        }
        $("cartTotal").textContent = [...totals.entries()].map(([currency,total]) => money(total,currency)).join(" + ");
      }

      function changeCartQuantity(item,delta) {
        const product = findCartProduct(item.productId);
        const variant = product?.variants?.find(option => option.id === item.variantId);
        const stock = variant ? Number(variant.stock_quantity) : Number(product?.stock_quantity || 0);
        const tracked = Boolean(product?.track_inventory);
        const next = item.quantity + delta;
        if (next <= 0) cart = cart.filter(line => line !== item);
        else if (!tracked || next <= stock) item.quantity = next;
        saveCart();
        renderCart();
      }

      function addToCart(product,variant,quantity) {
        const stock = variant ? Number(variant.stock_quantity) : Number(product.stock_quantity);
        const tracked = Boolean(product.track_inventory);
        const key = variant?.id || "";
        const existing = cart.find(item => item.productId === product.id && (item.variantId || "") === key);
        const next = (existing?.quantity || 0) + quantity;
        if (tracked && next > stock) {
          alert(t("invalidQuantity"));
          return;
        }
        if (existing) existing.quantity = next;
        else cart.push({productId:product.id,variantId:key || null,quantity});
        saveCart();
        renderCart();
      }

      function renderProducts() {
        const container = $("products");
        container.replaceChildren();
        const query = $("search").value.trim().toLocaleLowerCase(language);
        const filtered = storeData.products.filter(product => {
          const categoryMatch = !categoryFilter || product.category_id === categoryFilter;
          const searchMatch = !query || (product.name + " " + (product.description || "")).toLocaleLowerCase(language).includes(query);
          return categoryMatch && searchMatch;
        });
        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = t("empty");
          container.append(empty);
          return;
        }
        for (const product of filtered) {
          const card = document.createElement("article");
          card.className = "product";
          const art = document.createElement("div");
          art.className = "product-art";
          art.setAttribute("aria-hidden","true");
          art.textContent = product.product_type === "service" ? "✦" : product.product_type === "digital" ? "⌘" : "◇";
          const body = document.createElement("div");
          body.className = "product-body";
          const name = document.createElement("h3");
          name.textContent = product.name;
          const description = document.createElement("p");
          description.textContent = product.description || "";
          const priceLine = document.createElement("div");
          priceLine.className = "price";
          priceLine.textContent = money(product.base_price,product.currency);
          if (product.compare_at_price && product.compare_at_price > product.base_price) {
            const compare = document.createElement("span");
            compare.className = "compare";
            compare.textContent = money(product.compare_at_price,product.currency);
            priceLine.append(compare);
          }
          body.append(name);
          if (product.is_featured) {
            const featured = document.createElement("p");
            featured.textContent = t("featured");
            body.append(featured);
          }
          if (description.textContent) body.append(description);
          body.append(priceLine);
          if (product.variants?.length) {
            const variants = document.createElement("div");
            variants.className = "variants";
            for (const variant of product.variants) {
              const line = document.createElement("span");
              line.textContent = variant.name + " · " + money(variant.price,product.currency) +
                (product.track_inventory ? " · " + t("stock") + ": " + variant.stock_quantity : "");
              variants.append(line);
            }
            body.append(variants);
          }
          const buy = document.createElement("div");
          buy.className = "product-buy";
          let variantSelect = null;
          if (product.variants?.length) {
            variantSelect = document.createElement("select");
            variantSelect.setAttribute("aria-label",t("variant"));
            const placeholder = document.createElement("option");
            placeholder.value = ""; placeholder.textContent = t("variant");
            variantSelect.append(placeholder);
            for (const variant of product.variants) {
              const option = document.createElement("option");
              option.value = variant.id;
              option.textContent = variant.name + " · " + money(variant.price,product.currency);
              option.disabled = product.track_inventory && Number(variant.stock_quantity) <= 0;
              variantSelect.append(option);
            }
            buy.append(variantSelect);
          }
          const quantity = document.createElement("input");
          quantity.type = "number"; quantity.min = "1"; quantity.step = "1"; quantity.value = "1";
          quantity.inputMode = "numeric"; quantity.setAttribute("aria-label",t("quantity"));
          if (product.track_inventory && !product.variants?.length) quantity.max = String(product.stock_quantity);
          buy.append(quantity);
          const add = document.createElement("button");
          add.type = "button"; add.className = "add-cart"; add.textContent = t("add");
          const noStock = product.track_inventory && (product.variants?.length
            ? product.variants.every(option => Number(option.stock_quantity) <= 0)
            : Number(product.stock_quantity) <= 0);
          add.disabled = noStock;
          if (noStock) add.textContent = t("outOfStock");
          add.addEventListener("click",() => {
            const amount = Number(quantity.value);
            const variant = variantSelect ? product.variants.find(option => option.id === variantSelect.value) : null;
            if (!Number.isInteger(amount) || amount < 1 || (variantSelect && !variant)) {
              quantity.focus(); return;
            }
            addToCart(product,variant,amount);
          });
          buy.append(add);
          body.append(buy);
          card.append(art,body);
          container.append(card);
        }
      }

      function renderCategories() {
        const filters = $("filters");
        filters.replaceChildren();
        const all = document.createElement("button");
        all.className = "filter";
        all.type = "button";
        all.textContent = t("all");
        all.setAttribute("aria-pressed",String(!categoryFilter));
        all.addEventListener("click",() => {categoryFilter="";renderCategories();renderProducts();});
        filters.append(all);
        for (const category of storeData.categories) {
          const button = document.createElement("button");
          button.className = "filter";
          button.type = "button";
          button.textContent = category.name;
          button.setAttribute("aria-pressed",String(categoryFilter === category.id));
          button.addEventListener("click",() => {categoryFilter=category.id;renderCategories();renderProducts();});
          filters.append(button);
        }
      }

      async function load() {
        try {
          const response = await fetch("/api/public/stores/" + encodeURIComponent(slug),{headers:{"Accept":"application/json"}});
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            $("status").hidden = false;
            $("status").textContent = response.status === 404 ? t("unavailable") : t("failed");
            $("storeName").textContent = "";
            return;
          }
          storeData = data;
          document.title = data.store.name + " | MMG OQVELA";
          document.body.dataset.template = ["modern","classic","minimal","boutique","tech","market","restaurant","fashion","electronics","beauty","luxury"].includes(data.store.template_key) ? data.store.template_key : "modern";
          $("businessType").textContent = data.store.business_type || "";
          $("storeName").textContent = data.store.name;
          $("storeDescription").textContent = data.store.description || "";
          const phone = String(data.store.whatsapp_phone || "").replace(/\D/g,"");
          if (/^\d{8,15}$/.test(phone)) {
            $("whatsappContact").href = "https://wa.me/" + phone;
            $("whatsappContact").hidden = false;
          }
          $("status").hidden = true;
          renderCategories();
          renderProducts();
          renderCart();
        } catch {
          $("status").hidden = false;
          $("status").textContent = t("failed");
        }
      }

      $("languageToggle").addEventListener("click",() => setLanguage(language === "ar" ? "en" : "ar"));
      $("search").addEventListener("input",renderProducts);
      setLanguage(language);
      $("storeName").textContent = t("loading");
      load();
    })();
  </script>
</body>
</html>
