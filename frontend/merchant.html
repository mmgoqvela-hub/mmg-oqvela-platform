<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>لوحة المتجر | MMG OQVELA</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c30;--panel2:#16243b;--line:#263752;--text:#f3f6fc;--muted:#91a2bb;--cyan:#54d5e8;--blue:#397be0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#17365a 0,transparent 38%),var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:18px max(5%,calc((100% - 1080px)/2));border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:1px;font-size:20px;direction:ltr}.brand span{color:var(--cyan)}.tag{color:var(--muted);font-size:13px}
main{width:min(1080px,92%);margin:28px auto 60px}.panel,.tile{background:linear-gradient(145deg,#16243b,#101a2c);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
h1{font-size:clamp(25px,5vw,36px);margin:8px 0 14px}h2{font-size:21px;margin:0 0 14px}p{line-height:1.8}.muted{color:var(--muted)}.hidden{display:none!important}
input,select,button{font:inherit}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0c1728;color:var(--text);margin:7px 0 14px}
button{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:white;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);font-weight:bold}button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{border-color:var(--cyan);color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{margin:0;padding:16px}.tile h3{margin:0 0 8px}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#233b5d;color:#b9d7ff;font-size:12px}
.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item strong{display:block;margin-bottom:6px}.item small{color:var(--muted);line-height:1.8}
.notice{padding:12px;border-radius:10px;background:#233b5d;margin:12px 0;color:#dbeafe}.error{background:#7f1d2d55;color:#fecdd3}.success{background:#14532d55;color:#bbf7d0}
label{display:block;color:#d7e1ef;font-size:14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:560px){header{padding:15px 4%}main{width:94%;margin-top:16px}.panel{padding:15px}.row{display:block}}
</style>
</head>
<body>
<header><div><div class="brand">MMG <span>OQVELA</span></div><div class="tag">مساحة صاحب المتجر</div></div><button id="logout" class="hidden">تسجيل الخروج</button></header>
<main>
<section id="loginPanel" class="panel">
<h1>دخول صاحب المتجر</h1><p class="muted">سجّل الدخول للوصول إلى متجرك وطلباته وزبائنك فقط.</p>
<form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="primary" type="submit">تسجيل الدخول</button></form>
<div id="loginMessage" class="notice hidden" role="status"></div>
</section>
<section id="app" class="hidden">
<div class="panel"><div class="section-head"><div><div class="tag">لوحة التحكم</div><h1 id="storeName">متجرك</h1><div id="userLabel" class="muted"></div></div><div id="storePickerWrap" class="hidden"><label for="storePicker">اختر المتجر</label><select id="storePicker"></select></div></div><div id="appMessage" class="notice hidden" role="status"></div>
<div class="grid"><div class="tile"><div class="muted">المنتجات</div><h2 id="productCount">—</h2></div><div class="tile"><div class="muted">الطلبات</div><h2 id="orderCount">—</h2></div><div class="tile"><div class="muted">الزبائن</div><h2 id="customerCount">—</h2></div></div></div>
<nav class="tabs" aria-label="أقسام المتجر"><button class="active" data-tab="orders">الطلبات</button><button data-tab="products">المنتجات</button><button data-tab="customers">سجل الزبائن</button></nav>
<section id="orders" class="panel"><div class="section-head"><h2>طلبات المتجر</h2><button data-refresh="orders">تحديث</button></div><div id="ordersList" class="muted">جار التحميل…</div></section>
<section id="products" class="panel hidden"><div class="section-head"><h2>منتجات المتجر</h2><button data-refresh="products">تحديث</button></div><div id="productsList" class="muted">جار التحميل…</div></section>
<section id="customers" class="panel hidden"><div class="section-head"><h2>سجل الزبائن</h2><button data-refresh="customers">تحديث</button></div><div id="customersList" class="muted">جار التحميل…</div><div id="customerHistory" class="hidden"></div></section>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let sessionData=null,activeStore=null,ordersCache=[],customersCache=[];
const api=async(path,options={})=>{const response=await fetch(path,{credentials:"same-origin",cache:"no-store",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||"تعذر إكمال الطلب");return data};
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,c)=>Number(n||0).toLocaleString("ar",{maximumFractionDigits:2})+" "+(c||"");
const statusNames={pending:"جديد",confirmed:"تم التأكيد",processing:"قيد التجهيز",shipped:"جاهز / خرج للتسليم",completed:"مكتمل",cancelled:"ملغي",unpaid:"غير مدفوع",paid:"مدفوع",rejected:"مرفوض",refunded:"مسترد"};
function message(el,text,error=false){el.textContent=text;el.classList.remove("hidden","error","success");el.classList.add(error?"error":"success")}
async function loadSession(){try{sessionData=await api("/api/auth/me");if(!sessionData.stores?.length){$("loginPanel").classList.remove("hidden");message($("loginMessage"),"هذا الحساب لا يملك صلاحية الوصول إلى أي متجر.",true);return}showApp()}catch{$("loginPanel").classList.remove("hidden")}}
function showApp(){ $("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("userLabel").textContent=sessionData.user?.email||"";const stores=sessionData.stores||[];if(stores.length>1){$("storePickerWrap").classList.remove("hidden");$("storePicker").innerHTML=stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join("");$("storePicker").onchange=()=>selectStore($("storePicker").value)}selectStore(stores[0].id)}
async function selectStore(id){activeStore=sessionData.stores.find(s=>s.id===id);if(!activeStore)return;$("storeName").textContent=activeStore.name;await Promise.all([loadOrders(),loadProducts(),loadCustomers()])}
async function loadOrders(){try{const d=await api("/api/stores/"+encodeURIComponent(activeStore.id)+"/orders");ordersCache=d.orders||[];$("orderCount").textContent=ordersCache.length;$("ordersList").innerHTML=ordersCache.length?ordersCache.map(o=>{const next={pending:"confirmed",confirmed:"processing",processing:"shipped",shipped:"completed"}[o.order_status];const blocked=o.payment_method==="shamcash"&&o.payment_status!=="paid";return '<article class="item"><strong>طلب #'+esc(o.order_number)+' — '+esc(o.customer_name)+'</strong><small>الهاتف: '+esc(o.customer_phone)+'<br>العنوان: '+esc(o.shipping_address)+'<br>التاريخ: '+esc(o.created_at)+'<br>الحالة: '+esc(statusNames[o.order_status]||o.order_status)+' · الدفع: '+esc(statusNames[o.payment_status]||o.payment_status)+'<br>الإجمالي: '+money(o.total,o.currency)+'</small><p>'+((o.items||[]).map(i=>esc(i.product_name)+' × '+esc(i.quantity)).join("، "))+'</p>'+(next?'<button data-order="'+esc(o.id)+'" data-next="'+next+'" '+(blocked?"disabled":"")+'>'+({confirmed:"تأكيد الطلب",processing:"بدء التجهيز",shipped:"تحديد كجاهز",completed:"إكمال الطلب"}[next])+'</button>':"")+(blocked?'<small>يلزم التحقق من دفعة شام كاش قبل متابعة الطلب.</small>':"")+'</article>'}).join(""):'لا توجد طلبات حتى الآن.'}catch(e){$("ordersList").textContent=e.message}}
async function loadProducts(){try{const d=await api("/api/stores/"+encodeURIComponent(activeStore.id)+"/products");const rows=d.products||[];$("productCount").textContent=rows.length;$("productsList").innerHTML=rows.length?rows.map(p=>'<article class="item"><strong>'+esc(p.name)+'</strong><small>السعر: '+money(p.base_price,p.currency)+' · الوحدة: '+esc(p.sale_unit==="kg"?"كيلو":"قطعة")+' · الحالة: '+esc(p.status)+'</small></article>').join(""):"لا توجد منتجات."}catch(e){$("productsList").textContent=e.message}}
async function loadCustomers(){try{const d=await api("/api/stores/"+encodeURIComponent(activeStore.id)+"/customers");customersCache=d.customers||[];$("customerCount").textContent=customersCache.length;$("customersList").innerHTML=customersCache.length?customersCache.map(c=>'<article class="item"><strong>'+esc(c.customer_name)+'</strong><small>الهاتف: '+esc(c.customer_phone)+' · عدد الطلبات: '+esc(c.orders_count)+' · الإجمالي: '+money(c.total_orders_value)+'</small><p><button data-customer="'+encodeURIComponent(c.phone_key)+'">عرض سجل الطلبات</button></p></article>').join(""):"لا يوجد سجل زبائن بعد."}catch(e){$("customersList").textContent=e.message}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});await loadSession()}catch(err){message($("loginMessage"),err.message,true)}finally{b.disabled=false}});
$("logout").addEventListener("click",async()=>{try{await api("/api/auth/logout",{method:"POST",body:"{}"})}finally{location.reload()}});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["orders","products","customers"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab))}));
document.addEventListener("click",async e=>{const refresh=e.target.closest("[data-refresh]");if(refresh){({orders:loadOrders,products:loadProducts,customers:loadCustomers})[refresh.dataset.refresh]();return}const order=e.target.closest("[data-order]");if(order){order.disabled=true;try{await api("/api/stores/"+encodeURIComponent(activeStore.id)+"/orders/"+encodeURIComponent(order.dataset.order),{method:"PATCH",body:JSON.stringify({order_status:order.dataset.next})});await loadOrders()}catch(err){message($("appMessage"),err.message,true);order.disabled=false}return}const customer=e.target.closest("[data-customer]");if(customer){try{const phone=decodeURIComponent(customer.dataset.customer);const d=await api("/api/stores/"+encodeURIComponent(activeStore.id)+"/customers/"+encodeURIComponent(phone));$("customerHistory").classList.remove("hidden");$("customerHistory").innerHTML='<h2>سجل طلبات الزبون</h2>'+(d.orders||[]).map(o=>'<article class="item"><strong>طلب #'+esc(o.order_number)+'</strong><small>'+esc(o.created_at)+' · '+esc(statusNames[o.order_status]||o.order_status)+' · '+money(o.total,o.currency)+'</small><p>'+esc(o.shipping_address||"")+'</p></article>').join("")}catch(err){message($("appMessage"),err.message,true)}}});
loadSession();
</script>
</body></html>
