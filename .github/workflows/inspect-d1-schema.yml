name: Inspect D1 Schema (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect migrations 0010-0012 (read only)
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "SELECT type, name, sql FROM sqlite_master WHERE name IN ('accounts','store_subscriptions','platform_trial_settings','subscription_plans','payments','invoices','subscription_history','admin_activity_logs','idx_one_trial_per_account','idx_one_pending_subscription_per_store','idx_subscriptions_store_created','idx_payments_reference_lookup','idx_one_invoice_per_payment','trg_paid_approval_guard','trg_paid_approval_complete','trg_subscription_activation_guard','trg_paid_rejection_guard','trg_paid_rejection_complete') ORDER BY type, name"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(accounts)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(store_subscriptions)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(platform_trial_settings)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(subscription_plans)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(payments)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(invoices)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "PRAGMA table_info(subscription_history)"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "SELECT id, enabled, duration_days FROM platform_trial_settings ORDER BY id"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "SELECT id, name, price, duration_days, is_active FROM subscription_plans WHERE id='00000000-0000-4000-8000-000000000001'"
          npx --yes wrangler@4 d1 execute mmg-oqvela-db --remote --command "SELECT name, applied_at FROM d1_migrations ORDER BY name"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
