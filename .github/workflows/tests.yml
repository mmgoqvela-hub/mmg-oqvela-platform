name: Tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/mmg-oqvela-wrangler-dry-run
      - name: Run tests
        run: npm test
      - name: Validate SQLite migrations
        run: python tests/migrations/check_migrations.py
