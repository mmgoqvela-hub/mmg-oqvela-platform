name = "mmg-oqvela-platform"
main = "backend/worker.js"
compatibility_date = "2026-11-20"

workers_dev = true

[triggers]
crons = ["0 9 * * *"]

[assets]
directory = "./frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mmg-oqvela-db"
database_id = "537b494e-611b-44fb-9e34-f8721d2a9631"
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "STORE_MEDIA"
bucket_name = "mmg-oqvela-store-media"
